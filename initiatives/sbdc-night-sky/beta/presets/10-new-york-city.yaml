# A preset for the SBDC Night-Sky Simulator. See "Presets" in ../README.md.
# Keys that are left out take the simulator's defaults.

name: New York City, 30 minutes after sunset, October 20
category: Places
description: Evening twilight at New York's latitude, 40.7° N, with the default constellation. The sky is still bright, so only a few stars show while thousands of SBDCs are visible; the city's own skyglow is not included, and setting Ambient light to 8 or 9 adds it.

observer:
  latitude: 40.7
  date: Oct 20
  time: sunset +30
