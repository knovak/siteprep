name: Build and Deploy GitHub Pages

on:
  push:
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Cache Playwright Browsers
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright Browsers
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        # setup:browsers:ci is the runner variant: it also installs the system
        # libraries Chromium needs, which requires root. Developer machines use
        # npm run setup:browsers instead. See BUILD_TECHDOC.md.
        run: npm run setup:browsers:ci

      - name: Set version info
        id: version
        run: |
          BRANCH="${{ github.ref_name }}"
          # Sanitize branch name (replace / with -)
          SAFE_BRANCH=$(echo "$BRANCH" | sed 's/\//-/g')
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          echo "safe_branch=$SAFE_BRANCH" >> $GITHUB_OUTPUT
          if [ "$BRANCH" == "main" ]; then
            echo "version=main" >> $GITHUB_OUTPUT
            echo "is_main=true" >> $GITHUB_OUTPUT
          else
            echo "version=$BRANCH" >> $GITHUB_OUTPUT
            echo "is_main=false" >> $GITHUB_OUTPUT
          fi

      - name: Build and validate deck outputs
        env:
          BRANCH_NAME: ${{ steps.version.outputs.branch }}
          VERSION_NAME: ${{ steps.version.outputs.version }}
        # scripts/build.sh runs scripts/build_tests.sh before it succeeds, so a
        # build-test failure fails this step. BUILD-20 guards that invocation.
        run: npm run build

      - name: Run Playwright tests
        run: npm test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ steps.version.outputs.safe_branch }}
          path: playwright-report/
          retention-days: 30

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-build-${{ steps.version.outputs.safe_branch }}
          path: gh-pages/
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Stage deployment scripts
        run: |
          # The steps below work inside the gh-pages checkout, where the
          # scripts/ directory does not exist.
          mkdir -p /tmp/deploy-scripts
          cp scripts/push_gh_pages.sh scripts/wait_for_pages_deployment.sh /tmp/deploy-scripts/
          chmod +x /tmp/deploy-scripts/*.sh

      - name: Setup gh-pages branch
        run: |
          # Check if gh-pages branch exists on remote
          if git ls-remote --heads origin gh-pages | grep -q gh-pages; then
            echo "gh-pages branch exists, checking it out"
            git checkout gh-pages
          else
            echo "gh-pages branch doesn't exist, creating orphan branch"
            git checkout --orphan gh-pages
            git rm -rf .
            git clean -fxd
            echo "# GitHub Pages" > README.md
            git add README.md
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "Initialize gh-pages branch"
            git push -u origin gh-pages
          fi

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set version info
        id: version
        run: |
          BRANCH="${{ github.ref_name }}"
          # Sanitize branch name for use as directory (replace / with -)
          SAFE_BRANCH=$(echo "$BRANCH" | sed 's/\//-/g')
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          echo "safe_branch=$SAFE_BRANCH" >> $GITHUB_OUTPUT
          if [ "$BRANCH" == "main" ]; then
            echo "deploy_dir=." >> $GITHUB_OUTPUT
            echo "is_main=true" >> $GITHUB_OUTPUT
          else
            echo "deploy_dir=branch/$SAFE_BRANCH" >> $GITHUB_OUTPUT
            echo "is_main=false" >> $GITHUB_OUTPUT
          fi

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: site-build-${{ steps.version.outputs.safe_branch }}
          path: /tmp/build

      - name: Deploy to gh-pages
        run: |
          DEPLOY_DIR="${{ steps.version.outputs.deploy_dir }}"

          # For main branch, clear everything except branch directories
          if [ "${{ steps.version.outputs.is_main }}" == "true" ]; then
            # Remove all files except branch/ directory and .git
            find . -maxdepth 1 ! -name 'branch' ! -name '.git' ! -name '.' ! -name '..' -exec rm -rf {} + 2>/dev/null || true
          else
            # For feature branches, ensure the branch directory parent exists
            mkdir -p "branch"
          fi

          # Copy new build to deployment directory
          if [ "$DEPLOY_DIR" == "." ]; then
            cp -r /tmp/build/* .
          else
            rm -rf "$DEPLOY_DIR"
            cp -r /tmp/build "$DEPLOY_DIR"
          fi

      - name: Remove previews for deleted branches
        run: |
          [ -d "branch" ] || exit 0

          # Build the set of preview directory names from branches that still
          # exist. gh-pages and main do not have branch preview directories.
          git ls-remote --heads origin \
            | sed 's#^.*refs/heads/##' \
            | sed -e '/^gh-pages$/d' -e '/^main$/d' \
            | sed 's#/#-#g' \
            | sort -u > /tmp/active-preview-directories

          find branch -mindepth 1 -maxdepth 1 -type d -printf '%f\n' \
            | while IFS= read -r preview; do
                if ! grep -Fqx -- "$preview" /tmp/active-preview-directories; then
                  echo "Removing preview for deleted branch: branch/$preview"
                  rm -rf -- "branch/$preview"
                fi
              done

      - name: Generate versions index
        run: |
          # Create index-versions.html
          cat > index-versions.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>SitePrep - All Versions</title>
            <link rel="stylesheet" href="./shared/site_base/site_base.css">
            <script defer src="./shared/site_base/site_base.js"></script>
          </head>
          <body>
            <header class="card">
              <div class="card-header">
                <p class="tag">Version Browser</p>
                <h1>SitePrep - All Versions</h1>
              </div>
              <div class="card-content">
                <p>Browse different versions of the site, including the main version and branch previews.</p>
              </div>
            </header>
            <main class="card">
              <div class="card-header">
                <h2>Main Version</h2>
              </div>
              <div class="card-content">
                <ul class="toc-grid">
                  <li class="toc-item">
                    <h3><a href="./index.html">main</a></h3>
                    <p>Latest production version from main branch</p>
                  </li>
                </ul>
              </div>
            </main>
          EOF

          # Add branch previews section if any exist
          if [ -d "branch" ]; then
            BRANCH_DIRS=$(find branch -maxdepth 1 -type d ! -name 'branch' -printf '%f\n' | sort)
            if [ -n "$BRANCH_DIRS" ]; then
              cat >> index-versions.html <<'EOF'
            <main class="card">
              <div class="card-header">
                <h2>Branch Previews</h2>
                <p class="meta">Preview builds from feature branches</p>
              </div>
              <div class="card-content">
                <ul class="toc-grid">
          EOF

              for dir in $BRANCH_DIRS; do
                cat >> index-versions.html <<EOF
                  <li class="toc-item">
                    <h3><a href="./branch/${dir}/index.html">${dir}</a></h3>
                    <p>Preview from branch ${dir}</p>
                  </li>
          EOF
              done

              cat >> index-versions.html <<'EOF'
                </ul>
              </div>
            </main>
          EOF
            fi
          fi

          cat >> index-versions.html <<'EOF'
            <footer class="site-footer" data-version="main" data-root="">
              <script src="./shared/site_footer/site_footer.js"></script>
            </footer>
          </body>
          </html>
          EOF

      - name: Commit and push
        id: publish
        run: |
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit"
            echo "pushed=false" >> $GITHUB_OUTPUT
          else
            if [ "${{ steps.version.outputs.is_main }}" == "true" ]; then
              git commit -m "Deploy main version"
            else
              git commit -m "Deploy branch ${{ steps.version.outputs.branch }} preview"
            fi
            /tmp/deploy-scripts/push_gh_pages.sh
            echo "pushed=true" >> $GITHUB_OUTPUT
            echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          fi

      - name: Verify GitHub Pages deployment
        if: steps.publish.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: /tmp/deploy-scripts/wait_for_pages_deployment.sh "${{ steps.publish.outputs.sha }}"

      - name: Output deployment info
        id: deployment
        run: |
          if [ "${{ steps.version.outputs.is_main }}" == "true" ]; then
            echo "page_url=https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/" >> $GITHUB_OUTPUT
            echo "### Main Version Deployed!" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Main URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/" >> $GITHUB_STEP_SUMMARY
            echo "All Versions: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/index-versions.html" >> $GITHUB_STEP_SUMMARY
          else
            echo "page_url=https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/branch/${{ steps.version.outputs.safe_branch }}/" >> $GITHUB_OUTPUT
            echo "### Branch Preview Deployed!" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Preview URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/branch/${{ steps.version.outputs.safe_branch }}/" >> $GITHUB_STEP_SUMMARY
          fi
