name: Look up Peru trip availability
on:
  push:
    branches: ['deploy-record/machu-browser-check-20261123']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Read public trip pages in Chrome
        run: |
          node <<'NODE'
          const {chromium} = require('playwright');
          (async () => {
            const browser=await chromium.launch({channel:'chrome',headless:true});
            const region=async (page, label, match) => {
              const lines=(await page.locator('body').innerText()).split(/\n/).map(x=>x.trim()).filter(Boolean);
              const ids=new Set(); lines.forEach((x,i)=>{if(match.test(x))for(let j=Math.max(0,i-1);j<=Math.min(lines.length-1,i+2);j++)ids.add(j)});
              console.log(label, page.url(), Array.from(ids).sort((a,b)=>a-b).slice(0,125).map(i=>lines[i].slice(0,230)).join(' | '));
            };
            const controls=async (page,label) => console.log(label, (await page.locator('button,select,input:not([type=hidden]),[role=button],a').evaluateAll(es=>es.filter(e=>e.checkVisibility()&&e.getBoundingClientRect().height).map(e=>[e.tagName,e.getAttribute('type'),e.getAttribute('aria-label'),e.getAttribute('title'),e.id,e.className,e.innerText?.trim().slice(0,65),e.value].map(x=>String(x||'').slice(0,80)).join('|')).filter(x=>/edit|room|adult|guest|traveler|traveller|plus|more|increase|add|minus|less|select|person|capacity|quantity|count|date|price|availability|continue|apply/i.test(x)).slice(-110))).join('\n'));
            async function run(label,url,fn) {
              const page=await browser.newPage({viewport:{width:1400,height:950},locale:'en-US'});page.setDefaultTimeout(4000);
              try {const res=await page.goto(url,{waitUntil:'domcontentloaded',timeout:35000});await page.waitForTimeout(2500);
                console.log(label,'HTTP',res?.status(),'title',await page.title(),'first',(await page.locator('body').innerText()).slice(0,200)); await fn(page);
              }catch(e){console.log(label,'ERROR',String(e).slice(0,700))}
              await page.close();
            }
            async function clickText(page,pattern){const els=page.getByText(pattern);for(const el of await els.all())if(await el.isVisible()){await el.click({timeout:2800});return true}return false}
            await Promise.all([
             ...['Apr 24','May 29'].map(d=>run('BACK '+d,'https://www.backroads.com/trips/WPEI-9/peru-lodge-lodge-trekking-tour',async p=>{
               await clickText(p,/^Reject All$/i).catch(()=>false);
               await clickText(p,/^View Dates$/i); await clickText(p,/^2027$/).catch(()=>false);
               await clickText(p,new RegExp('^'+d+'$')); await p.waitForTimeout(650);
               await p.locator('.tripcal-dep-row.tripcal-open a.book-now').filter({visible:true}).first().click();await p.waitForTimeout(1500);
               for(const tab of p.context().pages()){
                 console.log('BACK TAB '+d,tab.url());
                 await clickText(tab,/^Let.s Go!$/i).catch(()=>false);
                 await tab.waitForTimeout(500);
                 for(const fr of tab.frames()){const txt=await fr.locator('body').innerText({timeout:3000}).catch(()=> ''); const lines=txt.split('\n').map(x=>x.trim()).filter(Boolean);console.log('BACK FR '+d,fr.url(),lines.filter(x=>/bed|room|select guests|let.s go|adult|booking|guest|contact us|request|continue|next/i.test(x)).slice(-70));
                  if(!/trip-dates-prices/.test(fr.url())||lines.some(x=>/^Room 1$|^Select Guests & Rooms$/i.test(x)))console.log('BACK FR CONTROLS '+d,await fr.locator('button,select,input,a,[role=button],[class*="plus"],[class*="add-room"]').evaluateAll(es=>es.filter(e=>e.checkVisibility()&&e.getBoundingClientRect().height).filter(e=>((e.tagName==='SELECT'||e.tagName==='INPUT')||/room|guest|adult|increase|add|bed|count|increment|plus|minus|continue/i.test(e.outerHTML.slice(0,400)))).slice(-45).map(e=>[e.outerHTML.slice(0,850),e.parentElement.innerText?.trim().slice(0,100)])));
                 }
               }
             })),
                          run('MNR','https://www.melissanoelrenzi.com/retreats-and-workshops/2027-peru-machu-picchu-retreat/',async p=>{
               const btn=p.getByRole('button',{name:'Check Availability'}).filter({visible:true}).last(); console.log('MNR btn',await btn.evaluate(e=>e.outerHTML));
               await btn.click();await p.waitForTimeout(2200);for(const tab of p.context().pages())for(const frame of tab.frames()){const txt=(await frame.locator('body').innerText({timeout:1600}).catch(()=> '')).trim();if(/WeTravel|King Room|Casita|Deposit/i.test(txt)){console.log('MNR FRAME',frame.url());console.log('MNR PACKAGES',txt.split('\n').map(x=>x.trim()).filter(x=>/available|left|sold out|king|casita|double|deposit|\$|choose your|select package|roommate|spot/i.test(x)).slice(-75));console.log('MNR SELECT',await frame.locator('select:visible').evaluateAll(os=>os.map(e=>[e.outerHTML.slice(0,1200),e.parentElement.parentElement.innerText.slice(0,600)])))}}
             }),
             run('VIATOR','https://www.viator.com/tours/Cusco/2-Day-Tour-of-Machu-Picchu-from-Cusco-with-Maras-and-Moray/d937-319951P21?date=2027-04-17',async p=>{
               console.log('VIATOR CONTEXT',(await p.locator('body').innerText()).slice(0,3000));console.log('VIATOR BUTTONS',await p.getByRole('button').allTextContents().then(z=>z.slice(0,50)));
             }),
             run('PERUHIKE','https://www.peruhike.com/tour/sacred-valley-and-machu-picchu-2-days/?currency=usd',async p=>{
               const txt=await p.locator('body').innerText();console.log('PERU HIKE INIT',p.url(),txt.split('\n').filter(x=>/book|date|available|person|private|calendar|room/i.test(x)).slice(-85));console.log('PERU HIKE ARGS',await p.locator('select,input,button,a').evaluateAll(es=>es.filter(e=>e.checkVisibility()&&e.getBoundingClientRect().height).filter(e=>/book|date|private|person|travel/i.test(e.outerHTML.slice(0,250))).slice(-24).map(e=>e.outerHTML.slice(0,550))));
             }),            ]);            await browser.close();
          })().catch(e=>{console.log(String(e));process.exit(1)});
          NODE