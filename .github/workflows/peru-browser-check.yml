name: Verify Machu Picchu package comparison
on:
  push:
    branches: ['deploy-record/machu-browser-check-20261123']
    paths: ['.github/workflows/peru-browser-check.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c6ad7c927528bb276e783501d61f52baf63061c4
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - uses: actions/cache/restore@v4
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-v2-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npm run setup:browsers:ci
      - name: Build final feature revision
        env:
          BRANCH_NAME: codex/machu-picchu-packages-2027
          VERSION_NAME: codex/machu-picchu-packages-2027
        run: npm run build
      - name: Check sortable comparison in Chromium
        run: npm test -- tests/e2e/machu-picchu-packages.spec.js --project=chromium
      - name: Capture the comparison page
        run: |
          python3 -m http.server 4183 --directory gh-pages > /tmp/machu-picchu-server.log 2>&1 &
          trap 'kill "$!" 2>/dev/null || true' EXIT
          mkdir -p screenshots
          for tick in $(seq 1 15); do
            if curl --fail --silent -o /dev/null http://127.0.0.1:4183/decks/peru/sections/machu-picchu-packages/overview.html; then break; fi
            sleep 1
          done
          node <<'NODE'
          const assert = require('node:assert/strict');
          const {chromium} = require('playwright');
          (async () => {
            const browser = await chromium.launch({channel:'chrome'});
            const page = await browser.newPage({viewport:{width:1440,height:1000}});
            await page.goto('http://127.0.0.1:4183/decks/peru/sections/machu-picchu-packages/overview.html');
            const count = await page.locator('#package-comparison tbody tr[data-start]').count();
            assert.equal(count,70);
            console.log('Verified dated departures', count, 'filters',await page.locator('#package-comparison select').count());
            console.log('Document heading:',await page.locator('h1').innerText(),'status:',await page.locator('#package-count').innerText());
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          npm run screenshot -- --channel=chrome --viewport-size="1440,1000" --wait-for-selector="#package-comparison tbody tr[data-start]" --wait-for-timeout=600 http://127.0.0.1:4183/decks/peru/sections/machu-picchu-packages/overview.html screenshots/machu-picchu-packages.png
      - uses: actions/upload-artifact@v4
        with:
          name: machu-picchu-package-preview
          path: screenshots/machu-picchu-packages.png
          retention-days: 30
  save-image:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: deploy-record/machu-browser-check-20261123
      - uses: actions/download-artifact@v4
        with:
          name: machu-picchu-package-preview
          path: screenshots
      - name: Save the verified image and retire the one-off runner
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f screenshots/machu-picchu-packages.png
          git rm .github/workflows/peru-browser-check.yml
          git commit -m 'Archive the verified Machu Picchu comparison screenshot'
          git push origin HEAD:refs/heads/deploy-record/machu-browser-check-20261123
          git rev-parse HEAD
