name: Look up Peru trip availability
on:
  push:
    branches: ['deploy-record/machu-browser-check-20261123']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Read public trip pages in Chrome
        run: |
          node <<'NODE'
          const {chromium} = require('playwright');
          (async () => {
            const browser=await chromium.launch({channel:'chrome',headless:true});
            const region=async (page, label, match) => {
              const lines=(await page.locator('body').innerText()).split(/\n/).map(x=>x.trim()).filter(Boolean);
              const ids=new Set(); lines.forEach((x,i)=>{if(match.test(x))for(let j=Math.max(0,i-1);j<=Math.min(lines.length-1,i+2);j++)ids.add(j)});
              console.log(label, page.url(), Array.from(ids).sort((a,b)=>a-b).slice(0,125).map(i=>lines[i].slice(0,230)).join(' | '));
            };
            const controls=async (page,label) => console.log(label, (await page.locator('button,select,input:not([type=hidden]),[role=button],a').evaluateAll(es=>es.filter(e=>e.checkVisibility()&&e.getBoundingClientRect().height).map(e=>[e.tagName,e.getAttribute('type'),e.getAttribute('aria-label'),e.getAttribute('title'),e.id,e.className,e.innerText?.trim().slice(0,65),e.value].map(x=>String(x||'').slice(0,80)).join('|')).filter(x=>/edit|room|adult|guest|traveler|traveller|plus|more|increase|add|minus|less|select|person|capacity|quantity|count|date|price|availability|continue|apply/i.test(x)).slice(-110))).join('\n'));
            async function run(label,url,fn) {
              const page=await browser.newPage({viewport:{width:1400,height:950},locale:'en-US'});page.setDefaultTimeout(4000);
              try {const res=await page.goto(url,{waitUntil:'domcontentloaded',timeout:35000});await page.waitForTimeout(2500);
                console.log(label,'HTTP',res?.status(),'title',await page.title(),'first',(await page.locator('body').innerText()).slice(0,200)); await fn(page);
              }catch(e){console.log(label,'ERROR',String(e).slice(0,1700))}
              await page.close();
            }
            async function clickText(page,pattern){const els=page.getByText(pattern);for(const el of await els.all())if(await el.isVisible()){await el.click({timeout:2800});return true}return false}
            await Promise.all([
             ...['Apr 24','May 29'].map(d=>run('BACK '+d,'https://www.backroads.com/trips/WPEI-9/peru-lodge-lodge-trekking-tour',async p=>{
               await clickText(p,/^Reject All$/i).catch(()=>false);
               await clickText(p,/^View Dates$/i); await clickText(p,/^2027$/).catch(()=>false);
               await clickText(p,new RegExp('^'+d+'$')); await p.waitForTimeout(650);
               await p.locator('.tripcal-dep-row.tripcal-open a.book-now').filter({visible:true}).first().click();await p.waitForTimeout(1500);
               await p.locator('.guests-and-rooms__challenging-ack-button:visible').first().click({timeout:3000}).catch(()=>false);
               const add=p.locator('.add-room:visible').first();await add.scrollIntoViewIfNeeded();await p.waitForTimeout(700);
               const covered=await add.evaluate(e=>{const b=e.getBoundingClientRect();const t=document.elementFromPoint(b.x+b.width/2,b.y+b.height/2);return {tag:t?.tagName,cls:t?.className,text:t?.innerText?.slice(0,150),same:e===t||e.contains(t)}}); console.log('BACK overlay',d,covered);
               if(/captcha|challenge|verif(y|ication)|bot protection/i.test(JSON.stringify(covered)))return;
               await add.focus();await add.press('Enter');await p.waitForTimeout(500);
               const adults=p.locator('input.adults-input:visible');
               for(const num of await adults.all()){
                 const inc=num.locator('..').locator('.update-value--increment');
                 for(let i=0;i<2&&Number(await num.inputValue())<2;i++){await inc.focus();await inc.press('Enter');}
               }
               const bed=p.locator('input.beds-input:visible'); console.log('BACK CONFIG '+d,'adults',await adults.evaluateAll(es=>es.map(e=>e.value)),'beds',await bed.evaluateAll(es=>es.map(e=>e.value)));
               const next=p.locator('button.continue-rooms-configuration:visible').first();await next.focus();await next.press('Enter'); await p.waitForTimeout(4500);
               for(const tab of p.context().pages()){
                 const t=(await tab.locator('body').innerText()).split('\n').map(x=>x.trim()).filter(Boolean);
                 console.log('BACK RESULT '+d,tab.url(),t.filter(x=>/room|guest|adult|reserve|price|\$|itinerary|cannot|available|request|selected|checkout|deposit|continue|full|limited|space|trip summary|traveler/i.test(x)).slice(0,95));
                 console.log('BACK first '+d,t.slice(0,55));
               }
             })),
                          run('G CLASSIC','https://www.gadventures.com/checkout/26380/overview/',async p=>{
               await p.locator('#onetrust-reject-all-handler:visible,#onetrust-accept-btn-handler:visible').first().click({timeout:3500}).catch(()=>false);
               const n=p.getByRole('spinbutton',{name:'number of adults'});await n.fill('4');await n.press('Tab');await p.waitForTimeout(900);
               const arrow=p.locator('button[class*="DepartureDateSelectorstyle__ArrowIconButton"]:visible').last();
               let section=()=>p.locator('body').innerText();const seen=new Set();
               for(let k=0;k<8;k++){
                 let txt=await section();const marks=txt.split('\n').filter(x=>/^(November|December|January|February|March|April|May|June|July) 202[67]$/.test(x));console.log('G months',marks,await n.inputValue());
                 if(marks.some(x=>/^April|^May|^June/.test(x))){
                   const list=await p.getByRole('button',{name:'Select',exact:true}).all();
                   const cards=[];for(const b of list){if(await b.isVisible()){let card=await b.evaluate(e=>{let n=e;for(let i=0;i<8&&n.parentElement;i++){n=n.parentElement;if(/(?:April|May|June)\s+\d+\s+to\s+/.test(n.innerText))break}return n.innerText.trim()});if(card.length<280)cards.push(card.replace(/\s+/g,' '));}}
                   console.log('G four-person dated cards',marks,cards);
                   for(const key of ['April 15','June 15','April 17','June 12']){if(seen.has(key))continue;const target=p.getByText(new RegExp('^(Sun|Mon|Tue|Wed|Thu|Fri|Sat) '+key+' to ')).filter({visible:true}).first();if(await target.count()){const parent=target.locator('xpath=ancestor::*[.//button[normalize-space()="Select"]][1]');if(await parent.count()){await parent.getByRole('button',{name:'Select',exact:true}).click();await p.waitForTimeout(500);const t=await section();console.log('G CLASSIC SELECTED',key,t.slice(t.lastIndexOf('Tour summary')).replace(/\s+/g,' '));seen.add(key);}}}
                 }
                 if(marks.some(x=>/^July/.test(x)))break;
                 if(!await arrow.count()){console.log('G CAL BUTTONS',await p.locator('button').evaluateAll(e=>e.filter(b=>b.querySelector('svg')&&!b.innerText).map(b=>b.outerHTML.slice(0,240)).slice(-12)));break}
                 await arrow.click();await p.waitForTimeout(600);
               }
             }),...['Apr','Jun'].map(month=>run('HIKEDATE '+month,'https://www.peruhike.com/tour/sacred-valley-and-machu-picchu-2-days/?currency=usd',async p=>{
               await p.locator('input.tourmaster-datepicker:visible').first().click();
               const want=month==='Apr'?'April 2027':'June 2027';for(let i=0;i<9;i++){const current=await p.locator('.ui-datepicker-title:visible').first().innerText();if(current===want)break;await p.locator('.ui-datepicker-next:visible').first().click();};
               const day=month==='Apr'?'17':'12';await p.locator('.ui-datepicker-calendar:visible a').filter({hasText:new RegExp('^'+day+'$')}).first().click();await p.waitForTimeout(650);
               const form=p.locator('input.tourmaster-datepicker:visible').locator('xpath=ancestor::form[1]'); console.log('PERU FORM '+month,await form.innerText(),await form.locator('select,input,button').evaluateAll(ns=>ns.filter(n=>n.type!=='hidden').map(n=>{const label=[n.tagName,n.name,n.value,n.type,n.className];if(n.tagName==='SELECT')label.push([...n.options].map(o=>[o.value,o.text]));return label})));
               for(const sel of await form.locator('select:visible').all()){const opts=await sel.locator('option').allTextContents();const four=opts.find(s=>/^4([ ]+(adults|persons|people|travellers|travelers))?$/i.test(s.trim()));const priv=opts.find(s=>/private/i.test(s));if(four)await sel.selectOption({label:four});if(priv)await sel.selectOption({label:priv});}
               await p.waitForTimeout(900);console.log('PERU results '+month,await form.innerText()); 
             })),            ]);            await browser.close();
          })().catch(e=>{console.log(String(e));process.exit(1)});
          NODE