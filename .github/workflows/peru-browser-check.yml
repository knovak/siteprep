name: Look up Peru trip availability
on:
  push:
    branches: ['deploy-record/machu-browser-check-20261123']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Read public trip pages in Chrome
        run: |
          node <<'NODE'
          const {chromium} = require('playwright');
          (async () => {
            const browser=await chromium.launch({channel:'chrome',headless:true});
            const region=async (page, label, match) => {
              const lines=(await page.locator('body').innerText()).split(/\n/).map(x=>x.trim()).filter(Boolean);
              const ids=new Set(); lines.forEach((x,i)=>{if(match.test(x))for(let j=Math.max(0,i-1);j<=Math.min(lines.length-1,i+2);j++)ids.add(j)});
              console.log(label, page.url(), Array.from(ids).sort((a,b)=>a-b).slice(0,125).map(i=>lines[i].slice(0,230)).join(' | '));
            };
            const controls=async (page,label) => console.log(label, (await page.locator('button,select,input:not([type=hidden]),[role=button],a').evaluateAll(es=>es.filter(e=>e.checkVisibility()&&e.getBoundingClientRect().height).map(e=>[e.tagName,e.getAttribute('type'),e.getAttribute('aria-label'),e.getAttribute('title'),e.id,e.className,e.innerText?.trim().slice(0,65),e.value].map(x=>String(x||'').slice(0,80)).join('|')).filter(x=>/edit|room|adult|guest|traveler|traveller|plus|more|increase|add|minus|less|select|person|capacity|quantity|count|date|price|availability|continue|apply/i.test(x)).slice(-110))).join('\n'));
            async function run(label,url,fn) {
              const page=await browser.newPage({viewport:{width:1400,height:950},locale:'en-US'});page.setDefaultTimeout(4000);
              try {const res=await page.goto(url,{waitUntil:'domcontentloaded',timeout:35000});await page.waitForTimeout(2500);
                console.log(label,'HTTP',res?.status(),'title',await page.title(),'first',(await page.locator('body').innerText()).slice(0,200)); await fn(page);
              }catch(e){console.log(label,'ERROR',String(e).slice(0,1700))}
              await page.close();
            }
            async function clickText(page,pattern){const els=page.getByText(pattern);for(const el of await els.all())if(await el.isVisible()){await el.click({timeout:2800});return true}return false}
            await Promise.all([
             run('G June total','https://www.gadventures.com/checkout/26380/overview/',async p=>{
               await p.locator('#onetrust-reject-all-handler:visible,#onetrust-accept-btn-handler:visible').first().click({timeout:3000}).catch(()=>false);
               const n=p.getByRole('spinbutton',{name:'number of adults'});await n.fill('4');await n.press('Tab');const arrow=p.locator('button[class*="DepartureDateSelectorstyle__ArrowIconButton"]:visible').last();
               const day=p.getByRole('button',{name:/^departure on June 15th, 2027 starting from/i});
               for(let k=0;k<10;k++){await p.waitForTimeout(950);if(await day.count())break;await arrow.click();}
               await day.click();await p.waitForTimeout(1200);
               const txt=()=>p.locator('body').innerText();
               if(!(await txt()).includes('4 travellers • Jun 15')){const row=p.getByText(/^(Sun|Mon|Tue|Wed|Thu|Fri|Sat) June 15 to /).filter({visible:true}).first();const card=row.locator('xpath=ancestor::*[.//button[normalize-space()="Select"]][1]');if(await card.count())await card.getByRole('button',{name:'Select',exact:true}).click();await p.waitForTimeout(420);}
               console.log('G FINAL', (await txt()).slice(-1200).replace(/\s+/g,' '));
             }),
             ...[['April','3','17'],['June','5','12']].map(([month,monthNum,day])=>run('PERU PRIVATE '+month,'https://www.peruhike.com/tour/sacred-valley-and-machu-picchu-2-days/?currency=usd',async p=>{
               const picker=p.locator('input.tourmaster-datepicker:visible').first();await picker.click();
               const date=p.locator('.ui-datepicker-calendar:visible td[data-year="2027"][data-month="'+monthNum+'"] a').filter({hasText:new RegExp('^'+day+'$')}).first();
               for(let k=0;k<12;k++){if(await date.count())break;console.log('PERU month',month,await p.locator('.ui-datepicker-title:visible').first().innerText());await p.locator('.ui-datepicker-next:visible').first().click();await p.waitForTimeout(100);}
               await date.click();await p.waitForTimeout(650);const actual=await picker.inputValue();console.log('PERU actual selected',month,actual);
               if(!actual.includes(month.slice(0,3)))return;
               await clickText(p,/^Select a package$/i);await p.waitForTimeout(400);const form=picker.locator('xpath=ancestor::form[1]');console.log('PERU public stock',month,await form.innerText());await clickText(p,/^Private Service$/i);await p.waitForTimeout(700);
               console.log('PERU controls',month,await form.locator('select,input,button,a').evaluateAll(ns=>ns.filter(e=>e.checkVisibility()).map(n=>[n.tagName,n.type,n.name,n.value,n.className,n.innerText?.slice(0,120),n.tagName==='SELECT'?[...n.options].slice(0,8).map(o=>[o.value,o.text]):null])));
               for(const sel of await form.locator('select:visible').all()){const name=await sel.getAttribute('name');const opts=await sel.locator('option').allTextContents();const four=opts.find(s=>/^4([ ]+(adults|persons|people|travellers|travelers))?$/i.test(s.trim()));if(four&&!/child|infant/i.test(name||''))await sel.selectOption({label:four});}
               await p.waitForTimeout(700);console.log('PERU summary',month,await form.innerText(),await form.locator('input:visible').evaluateAll(es=>es.map(e=>[e.name,e.value,e.id,e.className])));
             })),            ]);            await browser.close();
          })().catch(e=>{console.log(String(e));process.exit(1)});
          NODE