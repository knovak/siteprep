name: Look up Peru trip availability
on:
  push:
    branches: ['deploy-record/machu-browser-check-20261123']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Read public trip pages in Chrome
        run: |
          node <<'NODE'
          const {chromium} = require('playwright');
          (async () => {
            const browser=await chromium.launch({channel:'chrome',headless:true});
            const region=async (page, label, match) => {
              const lines=(await page.locator('body').innerText()).split(/\n/).map(x=>x.trim()).filter(Boolean);
              const ids=new Set(); lines.forEach((x,i)=>{if(match.test(x))for(let j=Math.max(0,i-1);j<=Math.min(lines.length-1,i+2);j++)ids.add(j)});
              console.log(label, page.url(), Array.from(ids).sort((a,b)=>a-b).slice(0,125).map(i=>lines[i].slice(0,230)).join(' | '));
            };
            const controls=async (page,label) => console.log(label, (await page.locator('button,select,input:not([type=hidden]),[role=button],a').evaluateAll(es=>es.filter(e=>e.checkVisibility()&&e.getBoundingClientRect().height).map(e=>[e.tagName,e.getAttribute('type'),e.getAttribute('aria-label'),e.getAttribute('title'),e.id,e.className,e.innerText?.trim().slice(0,65),e.value].map(x=>String(x||'').slice(0,80)).join('|')).filter(x=>/edit|room|adult|guest|traveler|traveller|plus|more|increase|add|minus|less|select|person|capacity|quantity|count|date|price|availability|continue|apply/i.test(x)).slice(-110))).join('\n'));
            async function run(label,url,fn) {
              const page=await browser.newPage({viewport:{width:1400,height:950},locale:'en-US'});page.setDefaultTimeout(4000);
              try {const res=await page.goto(url,{waitUntil:'domcontentloaded',timeout:35000});await page.waitForTimeout(2500);
                console.log(label,'HTTP',res?.status(),'title',await page.title(),'first',(await page.locator('body').innerText()).slice(0,200)); await fn(page);
              }catch(e){console.log(label,'ERROR',String(e).slice(0,700))}
              await page.close();
            }
            async function clickText(page,pattern){const els=page.getByText(pattern);for(const el of await els.all())if(await el.isVisible()){await el.click({timeout:2800});return true}return false}
            await Promise.all([
             ...['Apr 24','May 29'].map(d=>run('BACK '+d,'https://www.backroads.com/trips/WPEI-9/peru-lodge-lodge-trekking-tour',async p=>{
               await clickText(p,/^Reject All$/i).catch(()=>false);
               await clickText(p,/^View Dates$/i); await clickText(p,/^2027$/).catch(()=>false);
               await clickText(p,new RegExp('^'+d+'$')); await p.waitForTimeout(650);
               await p.locator('.tripcal-dep-row.tripcal-open a.book-now').filter({visible:true}).first().click();await p.waitForTimeout(1500);
               await p.locator('.guests-and-rooms__challenging-ack-button:visible').first().click({timeout:3000}).catch(()=>false);
               await p.locator('.add-room:visible').first().click();
               const adults=p.locator('input.adults-input:visible');
               for(const num of await adults.all()){
                 const inc=num.locator('..').locator('.update-value--increment');
                 for(let i=0;i<2&&Number(await num.inputValue())<2;i++)await inc.click();
               }
               const bed=p.locator('input.beds-input:visible'); console.log('BACK CONFIG '+d,'adults',await adults.evaluateAll(es=>es.map(e=>e.value)),'beds',await bed.evaluateAll(es=>es.map(e=>e.value)));
               await p.locator('button.continue-rooms-configuration:visible').first().click(); await p.waitForTimeout(4200);
               for(const tab of p.context().pages()){
                 const t=(await tab.locator('body').innerText()).split('\n').map(x=>x.trim()).filter(Boolean);
                 console.log('BACK RESULT '+d,tab.url(),t.filter(x=>/room|guest|adult|reserve|price|\$|itinerary|cannot|available|request|selected|checkout|deposit|continue|full|limited|space|trip summary|traveler/i.test(x)).slice(0,95));
                 console.log('BACK first '+d,t.slice(0,55));
               }
             })),
                          run('MNR','https://www.wetravel.com/checkout_embed?uuid=1774145122',async p=>{
              console.log('MNR DIRECT',p.url(),(await p.locator('body').innerText()).slice(0,4000));console.log('MNR SELECTIONS',await p.locator('select:visible,button:visible').evaluateAll(es=>es.map(e=>[e.outerHTML.slice(0,500),e.parentElement.parentElement.innerText?.slice(0,220)]).slice(0,40)));
             }),
             ...['11170-adventures-sacred-valley-machu-picchu-peru','10988-adventures-peru-machu-picchu-trekking'].map(slug=>run('MBA '+slug,'https://www.muchbetteradventures.com/en-us/products/'+slug+'/',async p=>{
               const text=await p.locator('body').innerText();console.log('MBA DATES '+slug,text.slice(text.lastIndexOf('Secure your spot')-100,text.lastIndexOf('Secure your spot')+1700)); 
               const card=p.getByText(/^(Sat 1 May 2027|Sat 29 May 2027|Sun 30 May 2027)/i).filter({visible:true}).first();
               console.log('MBA date raw '+slug,await card.evaluate(e=>e.parentElement.parentElement.outerHTML.slice(0,2700)).catch(()=>null)); const url=await card.evaluate(e=>e.closest('a')?.href||e.parentElement.parentElement.querySelector('a')?.href).catch(()=>null);
               console.log('MBA url '+slug,url);
               if(await card.count()){await card.click({timeout:2300}).catch(()=>false);await p.waitForTimeout(1100);console.log('MBA render '+slug,p.url(),(await p.locator('body').innerText()).split('\n').map(x=>x.trim()).filter(x=>/number of|guest|person|room|booking|deposit|available|\/group|group size/i.test(x)).slice(-52));}
             })),            ]);            await browser.close();
          })().catch(e=>{console.log(String(e));process.exit(1)});
          NODE