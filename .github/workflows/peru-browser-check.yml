name: Look up Peru trip availability
on:
  push:
    branches: ['deploy-record/machu-browser-check-20261123']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Read public trip pages in Chrome
        run: |
          node <<'NODE'
          const {chromium} = require('playwright');
          (async () => {
            const browser=await chromium.launch({channel:'chrome',headless:true});
            const region=async (page, label, match) => {
              const lines=(await page.locator('body').innerText()).split(/\n/).map(x=>x.trim()).filter(Boolean);
              const ids=new Set(); lines.forEach((x,i)=>{if(match.test(x))for(let j=Math.max(0,i-1);j<=Math.min(lines.length-1,i+2);j++)ids.add(j)});
              console.log(label, page.url(), Array.from(ids).sort((a,b)=>a-b).slice(0,125).map(i=>lines[i].slice(0,230)).join(' | '));
            };
            const controls=async (page,label) => console.log(label, (await page.locator('button,select,input:not([type=hidden]),[role=button],a').evaluateAll(es=>es.filter(e=>e.checkVisibility()&&e.getBoundingClientRect().height).map(e=>[e.tagName,e.getAttribute('type'),e.getAttribute('aria-label'),e.getAttribute('title'),e.id,e.className,e.innerText?.trim().slice(0,65),e.value].map(x=>String(x||'').slice(0,80)).join('|')).filter(x=>/edit|room|adult|guest|traveler|traveller|plus|more|increase|add|minus|less|select|person|capacity|quantity|count|date|price|availability|continue|apply/i.test(x)).slice(-110))).join('\n'));
            async function run(label,url,fn) {
              const page=await browser.newPage({viewport:{width:1400,height:950},locale:'en-US'});page.setDefaultTimeout(4000);
              try {const res=await page.goto(url,{waitUntil:'domcontentloaded',timeout:35000});await page.waitForTimeout(2500);
                console.log(label,'HTTP',res?.status(),'title',await page.title(),'first',(await page.locator('body').innerText()).slice(0,200)); await fn(page);
              }catch(e){console.log(label,'ERROR',String(e).slice(0,700))}
              await page.close();
            }
            async function clickText(page,pattern){const els=page.getByText(pattern);for(const el of await els.all())if(await el.isVisible()){await el.click({timeout:2800});return true}return false}
            await Promise.all([
             ...['Apr 24','May 29'].map(d=>run('BACK '+d,'https://www.backroads.com/trips/WPEI-9/peru-lodge-lodge-trekking-tour',async p=>{
               await clickText(p,/^Reject All$/i).catch(()=>false);
               await clickText(p,/^View Dates$/i); await clickText(p,/^2027$/).catch(()=>false);
               await clickText(p,new RegExp('^'+d+'$')); await p.waitForTimeout(650);
               await clickText(p,/^Book Now$/i);await p.waitForTimeout(1000);
               if(await clickText(p,/^Let.s Go!$/i).catch(()=>false))await p.waitForTimeout(500);
               console.log('BACK FLOW '+d,(await p.locator('body').innerText()).split('Dates & Prices').slice(-1)[0].slice(0,2400));
               const chosen=p.getByText(/Select Guests & Rooms/i).filter({visible:true}).first();
               console.log('BACK PANEL '+d,await chosen.evaluate(e=>{let x=e;for(let i=0;i<8&&x.parentElement;i++){x=x.parentElement;if(x.querySelectorAll('input,select,button,[class*="plus"],[class*="add"]').length>=3)break}return x.outerHTML.slice(0,20000)}).catch(()=>null));
               console.log('BACK active numeric '+d,await p.locator('select:visible,input:visible,[class*="plus"]:visible,[class*="minus"]:visible,[class*="add-room"]:visible,[class*="increment"]:visible').evaluateAll(es=>es.map(e=>[e.outerHTML.slice(0,520),e.parentElement.innerText?.trim().slice(0,140)]).slice(-32)));
             })),
             ...['Sat May 8 to Sun May 16','Sat May 15 to Sun May 23'].map(d=>run('G '+d,'https://www.gadventures.com/checkout/26374/overview/',async p=>{
               await p.waitForTimeout(1300);await p.locator('#onetrust-reject-all-handler:visible, #onetrust-accept-btn-handler:visible').first().click({timeout:2500}).catch(()=>false);const num=p.getByRole('spinbutton',{name:'number of adults'}); console.log('Gstepper',await num.evaluate(e=>e.parentElement.parentElement.outerHTML.slice(0,3200))); 
               if(await num.getAttribute('readonly')===null){await num.fill('4');await num.press('Tab');} else {const plus=num.locator('..').locator('button').last();for(let i=0;i<3;i++)await plus.click();}
               await p.waitForTimeout(1200); console.log('Gcount',await num.inputValue()); await region(p,'G dates after guest selection '+d,/Searching tours|travellers|May 8 to|May 15 to|Only.*spots left|selected itinerary/i);
               const title=p.getByText(d,{exact:true}); const parent=title.locator('xpath=ancestor::*[.//button[normalize-space()="Select"]][1]');console.log('Gdatecard',await parent.innerText());await parent.getByRole('button',{name:'Select',exact:true}).click();await p.waitForTimeout(1000);
               const txt=await p.locator('body').innerText(); console.log('GAFTER '+d,txt.slice(-2400)); 
             }))
            ]);            await browser.close();
          })().catch(e=>{console.log(String(e));process.exit(1)});
          NODE