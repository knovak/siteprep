name: Initiatives digest

# The sweep's survey phase, twice daily, on its own.
#
# Every part of the survey is derived from initiative.json, the files present,
# and git, so this needs no model - it runs `initiatives.mjs digest` and keeps a
# single issue current. The phases that need one, and the merge phase that needs
# permission to land a pull request, run in the scheduled sweep instead; see
# initiatives/sweep-setup.md. This workflow never changes anything and never
# merges anything, whatever `phases` in sweep.json allows.
#
# Noise is the failure mode of a twice-daily job, so the issue body is refreshed
# silently and a comment - the only thing that notifies - is posted solely when
# the set of decisions waiting on a human actually changes.

on:
  schedule:
    - cron: '0 7 * * *'
    - cron: '0 19 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: initiatives-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Last activity comes from git history, so a shallow clone would
          # report every initiative as changed today.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build the digest
        id: digest
        run: |
          if [ ! -d initiatives ]; then
            echo "no initiatives directory; nothing to survey"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node scripts/initiatives.mjs digest > digest.md
          node scripts/initiatives.mjs digest --json > digest.json
          cat digest.md

      - name: Update the digest issue
        if: steps.digest.outputs.skip != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const TITLE = 'Initiatives digest';
            const body = fs.readFileSync('digest.md', 'utf8');
            const digest = JSON.parse(fs.readFileSync('digest.json', 'utf8'));

            // What a person actually has to act on. Everything else is state
            // they can look at when they choose to.
            const decisions = digest.decisions
              .map((d) => `${d.slug}|${d.blocker}`)
              .sort()
              .join('\n');
            const marker = `<!-- decisions:${Buffer.from(decisions).toString('base64')} -->`;
            const fullBody = `${body}\n\n${marker}`;

            const existing = (await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'initiatives-digest',
              per_page: 10
            })).data.find((issue) => issue.title === TITLE);

            if (!existing) {
              if (!decisions) {
                core.info('Nothing waiting on a decision, and no open digest issue. Staying quiet.');
                return;
              }
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: TITLE,
                body: fullBody,
                labels: ['initiatives-digest']
              });
              core.info(`Opened #${created.data.number}`);
              return;
            }

            // Refreshing the body does not notify anyone, so the issue can stay
            // current without costing attention.
            if (existing.body !== fullBody) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: fullBody
              });
            }

            // A comment does notify, so it is reserved for the one event worth
            // interrupting someone about: the set of decisions changed.
            const previous = (existing.body || '').match(/<!-- decisions:([^ ]*) -->/);
            const previousDecisions = previous
              ? Buffer.from(previous[1], 'base64').toString('utf8')
              : '';

            if (decisions !== previousDecisions) {
              const summary = decisions
                ? digest.decisions.map((d) => `- **${d.slug}** — ${d.item}\n  - \`${d.kind}\`: ${d.detail}`).join('\n')
                : '_Nothing is waiting on you now._';
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `### What is waiting on you changed\n\n${summary}\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_`
              });
            }
